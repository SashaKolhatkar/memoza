# Render Blueprint for Memoza's database.
# The API web service (memoza-api) is managed separately in Render: its name and
# hostname were changed after the original Blueprint deployment, so re-adding it
# here could create a duplicate service. Blueprint Auto Sync is intentionally off.
# The React frontend is deployed separately on Vercel (see frontend/vercel.json).

databases:
  # The service name, database name, and user stay as "dayflow" to preserve the
  # existing database; Render does not allow renaming blueprint-managed services.
  - name: dayflow-db
    plan: free
    databaseName: dayflow
    user: dayflow
